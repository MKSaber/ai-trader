services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lse_pattern_lab}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lse} -d ${POSTGRES_DB:-lse_pattern_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://lse:lse_dev_password@db:5432/lse_pattern_lab
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_ROOT: /data
      MARKET_DATA_PROVIDER: yfinance
      DEMO_MODE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/data
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://lse:lse_dev_password@db:5432/lse_pattern_lab
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_ROOT: /data
      MARKET_DATA_PROVIDER: yfinance
    volumes:
      - ./storage:/data
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.jobs.worker.WorkerSettings

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
