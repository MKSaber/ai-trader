[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "live-candle-pattern-test"
version = "0.1.0"
description = "Independent live candlestick pattern observation and paper-trade lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.35",
  "psycopg[binary]==3.2.3",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "pandas==2.2.3",
  "numpy==2.1.2",
  "yfinance==1.7.0",
  "curl_cffi==0.16.3",
  "exchange-calendars==4.5.5",
  "httpx==0.27.2",
  "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
