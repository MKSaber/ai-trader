name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: lse
          POSTGRES_PASSWORD: lse_dev_password
          POSTGRES_DB: lse_pattern_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lse -d lse_pattern_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://lse:lse_dev_password@localhost:5432/lse_pattern_lab
      LOCAL_STORAGE_ROOT: /tmp/lse-storage
      MARKET_DATA_PROVIDER: fixture
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest -q
      - name: Offline pipeline smoke
        run: python -m app.cli daily-run --offline --dry-run
        continue-on-error: false

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
