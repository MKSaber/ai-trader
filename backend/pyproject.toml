[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lse-pattern-lab"
version = "0.1.0"
description = "LSE Pattern Lab — local-first equity research and paper-trading research pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.35",
  "psycopg[binary]==3.2.3",
  "alembic==1.13.3",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "python-multipart==0.0.12",
  "pandas==2.2.3",
  "numpy==2.1.2",
  "scikit-learn==1.5.2",
  "lightgbm==4.5.0",
  "yfinance==0.2.44",
  "openpyxl==3.1.5",
  "pdfplumber==0.11.4",
  "httpx==0.27.2",
  "arq==0.26.1",
  "redis==5.1.1",
  "python-dateutil==2.9.0.post0",
  "pytz==2024.2",
  "exchange-calendars==4.5.5",
  "joblib==1.4.2",
  "boto3==1.35.39",
  "typer==0.12.5",
  "rich==13.9.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.6.9",
  "httpx==0.27.2",
]

[project.scripts]
lse-lab = "app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"
